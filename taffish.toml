[package]
name = "ilastik"
kind = "tool"
version = "1.4.2"
release = 2
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/ilastik"

[command]
name = "taf-ilastik"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/ilastik:1.4.2-r2"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64"

[meta]
domain = "bio"
categories = ["image-analysis", "machine-learning", "segmentation", "microscopy"]
keywords = ["ilastik", "bioimage", "pixel-classification", "object-classification", "tracking", "counting", "ome-zarr"]
description = "Interactive and headless machine-learning workflows for biological image analysis."

[upstream]
name = "ilastik"
type = "github"
repo = "ilastik/ilastik"
homepage = "https://www.ilastik.org"
release_url = "https://github.com/ilastik/ilastik/releases/tag/1.4.2"
downloads = ["https://files.ilastik.org/ilastik-1.4.2-Linux.tar.bz2"]
version = "1.4.2"
license = "GPL-2.0-or-later WITH ilastik-plugin-exception; lazyflow is LGPL-2.1-or-later"
citation = "Berg et al. ilastik: interactive machine learning for (bio)image analysis. Nature Methods (2019)."
doi = "10.1038/s41592-019-0582-9"
watch = "tags"

[smoke]
backend = "docker"
timeout = 180
exist = ["ilastik", "ilastik-gui", "ilastik-models", "ilastik-smoke", "python", "Xvfb", "twm", "x11vnc", "websockify", "xdotool", "curl"]
test = ["ilastik-smoke identity", "ilastik-smoke modules", "ilastik-smoke runtime-closure", "ilastik-smoke data-conversion", "ilastik-smoke model-contract", "ilastik-smoke model-fixture", "ilastik-smoke model-download", "ilastik-smoke gui-project-term", "ilastik-smoke gui-startup-interrupt", "ilastik-smoke gui-errors", "ilastik-smoke wm-startup-failure", "ilastik-smoke wm-runtime-failure", "ilastik-smoke rfb-contract", "ilastik-smoke vnc-readiness-failure", "ilastik-smoke xvfb-forced-cleanup", "ilastik-smoke gui-log-permissions", "ilastik-smoke gui-early-interrupt"]
